# DesOS 0.1 Preview; Calamares 3.3.14 (Ubuntu 26.04 package).
---
modules-search: [local, /usr/lib/desos/calamares/modules]
branding: desos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
# The disk page is DesOS's own (installer/DESIGN.md, "The disk page"): the
# launcher reads the disks before Calamares starts, the page (notesqml@desosdisk,
# QML in the branding) records the choice, and desosdisk writes it where
# Calamares' partition job would. Manual partitioning keeps Calamares' partition page:
# desos-installer --manual uses settings-manual/ instead of this file.
instances:
  - id: desosdisk
    module: notesqml
    config: desosdisk.conf
  # Ubuntu's bootloader job, which would otherwise demand the partition module
  # (installer/modules/desosbootloader/main.py).
  - id: bootloader
    module: desosbootloader
    config: bootloader.conf
sequence:
  - show: [welcome, locale, keyboard, notesqml@desosdisk, users, summary]
  - exec:
      - desosdisk
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - desoscleanup
      - hwclock
      - initramfs
      - grubcfg
      - desosbootloader@bootloader
      - shellprocess
      - umount
  - show: [finished]
