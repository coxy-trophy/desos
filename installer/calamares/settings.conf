# DesOS 0.1 Preview; Calamares 3.3.14 (Ubuntu 26.04 package).
---
modules-search: [local, /usr/lib/desos/calamares/modules]
branding: desos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
sequence:
  - show: [welcome, locale, keyboard, partition, users, summary]
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - desoscleanup
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess
      - umount
  - show: [finished]
