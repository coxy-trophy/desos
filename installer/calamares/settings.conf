# DesOS 0.1 Preview; Calamares 3.3.14 (Ubuntu 26.04 package).
---
modules-search: [local, /usr/lib/desos/calamares/modules]
branding: desos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
# The disk page is DesOS's own (installer/DESIGN.md, "Disk"): desosdiskprobe
# reads the disks before the first page, the page (notesqml@desosdisk, QML in
# the branding) records the choice, and desosdisk writes it where Calamares'
# partition job would. Manual partitioning keeps Calamares' partition page:
# desos-installer --manual uses settings-manual/ instead of this file.
instances:
  - id: desosdisk
    module: notesqml
    config: desosdisk.conf
sequence:
  - exec: [desosdiskprobe]
  - show: [welcome, locale, keyboard, notesqml@desosdisk, users, summary]
  - exec:
      - desosdisk
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - desoscleanup
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess
      - umount
  - show: [finished]
