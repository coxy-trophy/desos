---
extraMounts:
  - device: proc
    fs: proc
    mountPoint: /proc
  - device: sys
    fs: sysfs
    mountPoint: /sys
  - device: /dev
    mountPoint: /dev
    options: [bind]
  - device: tmpfs
    fs: tmpfs
    mountPoint: /run
  - device: /run/udev
    mountPoint: /run/udev
    options: [bind]
  - device: efivarfs
    fs: efivarfs
    mountPoint: /sys/firmware/efi/efivars
    efi: true
# Used only when the root filesystem is btrfs. The names are a contract with
# desos-undo (/etc/desos-undo.conf [layout]) and its GRUB snapshot menu:
#   @           the system; the only subvolume a rollback replaces
#   @snapshots  read-only snapshots of @ plus undo state, outside every snapshot
#   @home @root personal files, never rolled back
#   @log @cache @tmp  kept across rollbacks so evidence of a failure survives
#                     and bulky caches are not snapshotted
# /boot stays inside @ (kernel and modules roll back together) and /var/lib
# stays inside @ (the dpkg database must match the installed files).
btrfsSubvolumes:
  - mountPoint: /
    subvolume: /@
  - mountPoint: /home
    subvolume: /@home
  - mountPoint: /root
    subvolume: /@root
  - mountPoint: /.snapshots
    subvolume: /@snapshots
  - mountPoint: /var/log
    subvolume: /@log
  - mountPoint: /var/cache
    subvolume: /@cache
  - mountPoint: /var/tmp
    subvolume: /@tmp
mountOptions:
  - filesystem: default
    options: [defaults]
  - filesystem: efi
    options: [defaults, umask=0077]
  # noatime: reads must not rewrite metadata shared with snapshots.
  # No compression: GRUB 2.14 could not read the zstd-compressed kernel in the
  # v4 image ("premature end of file"), so the installed system never started.
  # /boot lives in @ (and in every snapshot), so GRUB must read it as written.
  - filesystem: btrfs
    options: [defaults, noatime]
