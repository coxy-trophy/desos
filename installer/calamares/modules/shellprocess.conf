---
dontChroot: false
timeout: 60
verbose: true
script: |
  if ! /usr/bin/test -s /boot/grub/grub.cfg; then
      echo 'DesOS installation cannot finish: GRUB configuration is missing or empty.' >&2
      exit 1
  fi
  # GRUB 2.14 could not read the DesOS kernel exactly as the image unpacker wrote
  # it to btrfs ("premature end of file", v6 install test); a plain copy of the
  # same bytes reads. Rewrite every kernel and initrd before the first boot, byte
  # by byte (no reflink), keeping mode, owner and times. No dollar sign anywhere
  # in this script, comments included: Calamares reads a dollar and a name as
  # one of its own variables and refuses to run (VM test, 16 Nov 2026).
  /usr/bin/python3 - <<'REWRITE'
  import glob, os
  BOOT = "/boot"
  for path in sorted(glob.glob(BOOT + "/vmlinuz-*") + glob.glob(BOOT + "/initrd.img-*")):
      if os.path.islink(path) or not os.path.isfile(path):
          continue
      info = os.stat(path)
      fresh = path + ".desos-rewrite"
      with open(path, "rb") as source, open(fresh, "wb") as target:
          while True:
              block = source.read(1 << 20)
              if not block:
                  break
              target.write(block)
          target.flush()
          os.fsync(target.fileno())
      os.chown(fresh, info.st_uid, info.st_gid)
      os.chmod(fresh, info.st_mode & 0o7777)
      os.utime(fresh, ns=(info.st_atime_ns, info.st_mtime_ns))
      os.replace(fresh, path)
  REWRITE
  /usr/bin/sync
  /usr/lib/desos/select-upstream-kernel
i18n:
  name: Select the DesOS kernel for startup
