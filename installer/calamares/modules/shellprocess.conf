---
dontChroot: false
timeout: 60
verbose: true
script: |
  if ! /usr/bin/test -s /boot/grub/grub.cfg; then
      echo 'DesOS installation cannot finish: GRUB configuration is missing or empty.' >&2
      exit 1
  fi
  # GRUB 2.14 could not read the DesOS kernel exactly as the image unpacker wrote
  # it to btrfs ("premature end of file", v6 install test); a plain copy of the
  # same bytes reads. Rewrite every kernel and initrd before the first boot.
  for f in /boot/vmlinuz-* /boot/initrd.img-*; do
      if /usr/bin/test -f "$f" && ! /usr/bin/test -L "$f"; then
          /usr/bin/cp --reflink=never --sparse=never --preserve=mode,ownership,timestamps "$f" "$f.desos-rewrite"
          /usr/bin/mv -f "$f.desos-rewrite" "$f"
      fi
  done
  /usr/bin/sync
  /usr/lib/desos/select-upstream-kernel
i18n:
  name: Select the DesOS kernel for startup
