---
defaultGroups:
  - name: sudo
    must_exist: true
    system: true
  - name: audio
    must_exist: true
    system: true
  - name: video
    must_exist: true
    system: true
  - name: render
    must_exist: true
    system: true
sudoersGroup: ""
autologinGroup: ""
setRootPassword: false
doReusePassword: false
doAutologin: false
allowWeakPasswords: false
allowWeakPasswordsDefault: false
passwordRequirements:
  minLength: 8
  maxLength: -1
user:
  shell: /bin/bash
  forbidden_names: [root, nobody, desos, _greetd]
  home_permissions: o700
hostname:
  location: EtcFile
  writeHostsFile: true
  template: "${login}-desos"
  forbidden_names: [localhost]
allowActiveDirectory: false
