# Last page (Calamares 3.3.14 "finished" widget module).
#
# Its text is Calamares's own translated "All done." message. What to do next
# (restart, take out the USB, what sign-in looks like) is told twice where
# DesOS can write it: the last slideshow card during installation, and the
# step rail beside this page.
---
# Offer "Restart now" but leave it unticked: the person reads the page, takes
# the USB out when the screen goes dark, and nothing restarts by surprise.
restartNowMode: user-unchecked
restartNowCommand: systemctl -i reboot
notifyOnFinished: false
