# Welcome page (Calamares 3.3.14 "welcome" widget module).
#
# The heading and its one line of body text are Calamares's own translated
# strings, filled from branding.desc. The DesOS voice is carried by the
# picture beneath them (branding/desos/welcome.png): nothing is written until
# you confirm, everything installs from the USB, keep the power connected.
---
# No web links: the installer works offline and opens nothing remote.
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false
# A globe beside the language list, for someone who cannot read the language
# the page starts in. Resolved in the branding directory; if it cannot be
# loaded Calamares keeps its built-in icon.
languageIcon: language.svg
requirements:
  requiredStorage: 16.0
  requiredRam: 2.0
  check: [storage, ram, power, root, screen]
  required: [storage, ram, root]
# No network location lookup.
geoip:
  style: none
  url: ""
  selector: ""
