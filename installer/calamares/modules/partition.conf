---
efi:
  mountPoint: /boot/efi
  recommendedSize: 512MiB
  minimumSize: 300MiB
  label: EFI
# "Erase disk" is chosen when the page opens: the recommended way, which makes
# the EFI partition (UEFI) and the root partition itself, so nobody has to
# partition by hand. Nothing is written before the disk is picked and the
# summary's "Install now" is confirmed (prompt-install in settings.conf).
initialPartitioningChoice: erase
# btrfs is the default so that every system change can be undone (see
# undo/README.md). ext4 stays selectable in the "Erase disk" drop-down and in
# manual partitioning; desos-undo then reports that snapshots are unavailable.
defaultFileSystemType: btrfs
availableFileSystemTypes: [btrfs, ext4]
allowManualPartitioning: true
# Swap. zram (compressed RAM, system/README.md) is always on, so "No swap" is
# the default. "Swap" adds a small swap partition; "Hibernate" one the size of
# RAM, which the installer passes to the kernel as resume=. No swap *file*: an
# active swap file inside @ stops btrfs from snapshotting it, which would break
# desos-undo.
userSwapChoices: [none, small, suspend]
initialSwapChoice: none
enableLuksAutomatedPartitioning: false
lvm:
  enable: false
alwaysShowPartitionLabels: true
essentialMounts: [live-*, control, ventoy]
# "unknown" means: use the filesystem chosen above/in the drop-down. /boot is
# deliberately not a separate partition: kernels must live inside the root
# subvolume so that each snapshot carries the kernel that matches its modules.
partitionLayout:
  - name: root
    filesystem: unknown
    mountPoint: /
    size: 100%
