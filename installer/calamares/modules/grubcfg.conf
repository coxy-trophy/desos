---
# GRUB_TERMINAL_OUTPUT is deliberately absent: unset means gfxterm, which the
# DesOS boot theme (/etc/default/grub.d/20-desos-theme.cfg) needs. Setting it to
# console here would turn the theme off on every installation.
overwrite: true
prefer_grub_d: false
keep_distributor: false
# Calamares adds resume=UUID=... for a swap partition (Hibernate).
kernel_params: [quiet, splash]
defaults:
  GRUB_TIMEOUT: 5
  GRUB_TIMEOUT_STYLE: menu
  GRUB_DEFAULT: "0"
  GRUB_DISABLE_SUBMENU: false
  GRUB_DISABLE_OS_PROBER: true
always_use_defaults: true
