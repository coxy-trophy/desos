# DesOS 0.1 Preview; Calamares 3.3.14 (Ubuntu 26.04 package): MANUAL PARTITIONS.
# Used by "desos-installer --manual" (calamares --xdg-config, with this folder
# first in XDG_CONFIG_DIRS and /etc after it, so module configuration still
# comes from /etc/calamares/modules). Identical to ../../calamares/settings.conf
# except that Calamares' own partition page and job replace the DesOS disk page
# (tests/test_installer.py checks that).
---
modules-search: [local, /usr/lib/desos/calamares/modules]
branding: desos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
sequence:
  - show: [welcome, locale, keyboard, partition, users, summary]
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - localecfg
      - users
      - desoscleanup
      - hwclock
      - initramfs
      - grubcfg
      - bootloader
      - shellprocess
      - umount
  - show: [finished]
