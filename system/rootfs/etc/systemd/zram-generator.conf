# DesOS: compressed swap in RAM. The installer creates no disk swap and
# accepts 2 GB machines, so this is the only swap an installed system has.
# Half of RAM, capped at 4 GiB of uncompressed swap (1 GiB on a 2 GB machine).
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
fs-type = swap
