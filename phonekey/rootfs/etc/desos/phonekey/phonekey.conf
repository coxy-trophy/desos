# DesOS phone approval of administrator actions.
#
# This file switches nothing on. Phone approval is off until root runs
#   desos-phonekey enable --user NAME
# and it is off again after
#   desos-phonekey disable
# See /usr/share/desos/phonekey/README for what it does and does not protect.
#
# The values below are the defaults; out-of-range values are clamped.

# How long sudo waits for the phone before asking for the password (5-60).
timeout_seconds = 20

# After this many declined, unanswered or invalid requests in a row (1-10),
# the phone is not asked again for lockout_seconds (60-86400). The password
# keeps working throughout.
max_failures = 3
lockout_seconds = 600

# After any one failure, do not ask the phone again for this long (0-3600),
# so a mistyped password does not put a second prompt on the phone.
cooldown_seconds = 60

# At most this many phone prompts per user in ten minutes (1-60).
max_requests_per_10_minutes = 10
