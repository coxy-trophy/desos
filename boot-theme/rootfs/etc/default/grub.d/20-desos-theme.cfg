# DesOS boot menu theme. grub-mkconfig sources this after /etc/default/grub;
# run update-grub after changing it. To opt out, add a later fragment (for
# example 99-local.cfg) with GRUB_THEME= and GRUB_FONT= left empty.
#
# The theme lives beside grub.cfg in /boot/grub, so GRUB can read it wherever
# it can read its own configuration: a separate /boot, a btrfs root with
# subvolumes, or an encrypted root with an unencrypted /boot. grub-mkconfig
# writes the device and subvolume-relative path for it; a missing or unreadable
# theme is skipped and the text menu is used.
GRUB_THEME=/boot/grub/themes/desos/theme.txt
# The firmware's native mode. The theme lays out from 800x600 upwards, and a
# BIOS (VBE) machine takes 640x480 for "auto", so without UEFI a mode the
# theme fits is asked for first. grub-mkconfig runs on the machine it boots.
GRUB_GFXMODE=auto
[ -d /sys/firmware/efi ] || GRUB_GFXMODE=1024x768,800x600,auto
# Text outside the themed menu (messages, the plain menu if the theme cannot
# load) uses the same readout face; 06_desos_theme adds GRUB's unicode font for
# scripts this face does not cover.
GRUB_FONT=/boot/grub/themes/desos/jetbrains_mono_14.pf2
# GRUB_TERMINAL_OUTPUT is deliberately not set here: unset means gfxterm, which
# the theme needs, and GRUB_TERMINAL=console or serial in /etc/default/grub
# still turns the graphical menu off for machines that need that.
