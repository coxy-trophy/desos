# DesOS undo configuration. Values shown are the built-in defaults.

[layout]
# btrfs subvolumes created by the installer (installer/calamares/modules/mount.conf).
root_subvolume = @
snapshots_subvolume = @snapshots

[boot]
# Consecutive starts that never reached the sign-in screen before GRUB starts
# the last known-good snapshot. Run "sudo update-grub" after changing it.
failure_threshold = 3
# The greeter must stay up this long before a start counts as good.
good_stable_seconds = 10
# Give up waiting for the greeter after this long (the start stays "not good").
good_timeout_seconds = 600
# Also require a logind session (the greeter's) before marking a start good.
require_session = yes
# Snapshots offered in the GRUB "DesOS snapshots" submenu.
menu_entries = 15

[retention]
# Newest before/after transactions (apt, dpkg, desos-undo run) to keep.
keep_pairs = 10
keep_manual = 10
keep_boot_good = 3
keep_rollback = 5
# 0 disables age-based deletion.
max_age_days = 0
# Below this much free space, each prune also removes up to three of the
# oldest unprotected snapshots.
min_free_percent = 10

[diff]
# Directories compared file by file by "desos-undo diff" (packages always are).
paths = /etc
limit = 2000
